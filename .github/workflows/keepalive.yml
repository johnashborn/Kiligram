name: Keep Supabase awake

# Free Supabase projects pause after about a week without activity.
# This visits the database every 2 days so the gallery never goes to sleep.
# If the visit fails (for example the project already got paused), the run
# fails and GitHub emails you, so you know to restore it in the dashboard.

on:
  schedule:
    - cron: "17 3 */2 * *"   # every 2 days at 03:17 UTC
  workflow_dispatch:          # lets you run it by hand from the Actions tab

permissions:
  contents: read
  actions: write              # needed to keep this schedule switched on

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Visit the database
        run: |
          # The URL and the public anon key are already in the published site config.
          URL=$(grep -o 'https://[a-z0-9]*\.supabase\.co' site/config.js | head -1)
          KEY=$(grep -o 'eyJ[A-Za-z0-9._-]*' site/config.js | head -1)
          code=$(curl -sS -m 30 -o /dev/null -w "%{http_code}" \
            "$URL/rest/v1/photos?select=id&limit=1" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY")
          echo "Supabase answered HTTP $code"
          test "$code" = "200"

      - name: Keep this schedule switched on
        # GitHub turns off scheduled workflows in public repos after 60 days
        # without commits; switching it back on each run resets that clock.
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/keepalive.yml/enable"
